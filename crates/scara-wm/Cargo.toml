[package]
name = "scara-wm"
version = "0.1.0"
edition = "2021"

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit", "backend_drm", "backend_gbm", "backend_udev", "backend_libinput", "backend_session_libseat",
    "renderer_gl", "wayland_frontend", "desktop", "xwayland"
] }
winit = "0.30"
calloop = "0.14"
bitflags = "2.6"
mlua = { version = "0.10", features = ["lua54"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }